<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>gameplanner - Hangman</title>
    <style>
        /* Resets the page so the game takes up the full window */
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: block; 
        }
        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
  </head>
  <body>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <script>
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Website.data",
        frameworkUrl: buildUrl + "/Website.framework.js",
        codeUrl: buildUrl + "/Website.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Hangman",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true, 
        devicePixelRatio: window.devicePixelRatio || 1
      };

      // DUMMY FUNCTIONS: Keeps your game from crashing if Unity tries to call these 
      window.onUnityConsumeToken = function() { console.log("Tokens consumed"); };
      window.onUnityGainCoupons = function() { console.log("Coupons gained"); };

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      // Auto-load the game (Replaces the startUnityGame() function from your old thumbnail click)
      var script = document.createElement("script");
      script.src = "Build/Website.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
